<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../StyleSheet/style.css">
    <title>Cadastro - B.S.BUSINESS</title>
</head>
<body class="body-auth">

    <div class="auth-card auth-card-wide">
        <div class="auth-header">
            <h1>B.S.BUSINESS</h1>
            <p>Crie sua conta e entre direto na plataforma</p>
        </div>

        <form class="auth-form" action="#" method="POST" id="formCadastroUsuario">
            
            <div class="input-group">
                <label>Tipo de Conta</label>
                <div class="tipo-conta-selector">
                    <label class="radio-label">
                        <input type="radio" name="tipo_conta" value="cliente" checked onchange="alternarTipoConta(this.value)">
                        Cliente
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="tipo_conta" value="vendedor" onchange="alternarTipoConta(this.value)">
                        Vendedor (Empresa)
                    </label>
                </div>
            </div>

            <!-- Campos de Pessoa Física (Cliente) -->
            <div class="form-row" id="boxNomePessoa">
                <div class="input-group">
                    <label for="nome_cad">Nome</label>
                    <input type="text" id="nome_cad" name="nome" placeholder="Seu nome" required>
                </div>
                <div class="input-group" id="boxSobrenome">
                    <label for="sobrenome">Sobrenome</label>
                    <input type="text" id="sobrenome" name="sobrenome" placeholder="Seu sobrenome" required>
                </div>
            </div>

            <!-- Campos Exclusivos para Vendedor (Empresa) -->
            <div class="form-row" id="boxEmpresa" style="display: none;">
                <div class="input-group">
                    <label for="nome_empresa">Nome da Empresa / Loja</label>
                    <input type="text" id="nome_empresa" name="nome_empresa" placeholder="Razão social ou fantasia">
                </div>
                <div class="input-group">
                    <label for="cnpj">CNPJ da Empresa</label>
                    <input type="text" id="cnpj" name="cnpj" placeholder="00.000.000/0001-00">
                </div>
            </div>

            <!-- E-mail (Obrigatório para ambos — Vendedor recebe a chave de 12 dígitos nele) -->
            <div class="input-group">
                <label for="email_cad">E-mail <span id="avisoEmailVendedor" style="display:none; color:#2563eb; font-weight:normal;">(Enviaremos sua chave de 12 dígitos e link de autorização para este e-mail)</span></label>
                <input type="email" id="email_cad" name="email" placeholder="seu.email@exemplo.com" required>
            </div>

            <!-- Dois Campos de Senha (Senha + Confirmar Senha) -->
            <div class="form-row">
                <div class="input-group">
                    <label for="senha_cad">Criar Senha</label>
                    <input type="password" id="senha_cad" name="senha" placeholder="Digite sua senha" required>
                </div>
                <div class="input-group">
                    <label for="confirmar_senha_cad">Confirmar Senha</label>
                    <input type="password" id="confirmar_senha_cad" name="confirmar_senha" placeholder="Repita a senha criada" required>
                </div>
            </div>

            <!-- Endereço com Busca via CEP -->
            <div class="form-row">
                <div class="input-group">
                    <label for="cep">CEP</label>
                    <input type="text" id="cep" name="cep" placeholder="00000-000" maxlength="9" required>
                </div>
                <div class="input-group">
                    <label for="bairro">Bairro</label>
                    <input type="text" id="bairro" name="bairro" placeholder="Seu bairro" required>
                </div>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label for="rua">Rua / Logradouro</label>
                    <input type="text" id="rua" name="rua" placeholder="Ex: Av. Central, Rua 10..." required>
                </div>
                <div class="input-group input-group-short">
                    <label for="numero">Número</label>
                    <input type="text" id="numero" name="numero" placeholder="Nº" required>
                </div>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" name="cidade" placeholder="Sua cidade" required>
                </div>
                <div class="input-group input-group-short">
                    <label for="estado">Estado</label>
                    <select id="estado" name="estado" required>
                        <option value="">UF</option>
                        <option value="AC">AC</option><option value="AL">AL</option><option value="AP">AP</option>
                        <option value="AM">AM</option><option value="BA">BA</option><option value="CE">CE</option>
                        <option value="DF">DF</option><option value="ES">ES</option><option value="GO">GO</option>
                        <option value="MA">MA</option><option value="MT">MT</option><option value="MS">MS</option>
                        <option value="MG">MG</option><option value="PA">PA</option><option value="PB">PB</option>
                        <option value="PR">PR</option><option value="PE">PE</option><option value="PI">PI</option>
                        <option value="RJ">RJ</option><option value="RN">RN</option><option value="RS">RS</option>
                        <option value="RO">RO</option><option value="RR">RR</option><option value="SC">SC</option>
                        <option value="SP">SP</option><option value="SE">SE</option><option value="TO">TO</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn-auth">Finalizar Cadastro e Entrar</button>
        </form>

        <div class="auth-footer">
            <p>Já possui uma conta? <a href="login.html">Faça login</a></p>
            <p><a href="index.html">&larr; Voltar para a página inicial</a></p>
        </div>
    </div>

    <script src="../JavaScript/main.js"></script>
</body>
</html>
